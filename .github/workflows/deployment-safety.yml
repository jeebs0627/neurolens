name: Deployment safety
on:
  push:
    paths-ignore: [dataset-evolution-log.json]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix ci
      - run: python -m pip install -r requirements.txt
      - run: node ci/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - run: python -B ci/check.py
